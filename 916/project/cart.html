<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart | Enchanted Gift Hampers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      background: #fff8f5;
      font-family: 'Poppins', sans-serif;
      color: #4b3f72;
    }
    h1, .brand {
      font-family: 'Great Vibes', cursive;
      font-size: 2.5rem;
      color: #ba7ba1;
    }
    .card {
      background-color: #fff0f6;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .btn-primary {
      background-color: #e6a6be;
      border: none;
      font-weight: bold;
    }
    .btn-primary:hover {
      background-color: #d98ea6;
    }
    .quantity-input {
      width: 60px;
      text-align: center;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
    }
    .order-summary {
      background: #ffe4ec;
      padding: 20px;
      border-radius: 1rem;
    }
  </style>
</head>
<body>
  <div class="container my-5">
    <h1 class="text-center mb-4 brand">Your Enchanted Cart</h1>
    <div class="row g-4">
      <!-- Cart Items -->
      <div class="col-lg-8">
        <div class="card p-4 mb-3">
          <div class="row align-items-center">
            <div class="col-md-3">
              <img src="images/serum.jpg" alt="Hamper" class="img-fluid rounded">
            </div>
            <div class="col-md-5">
              <h5>Self-care Hamper</h5>
              <p>Includes Skincare, cute gifts and notes</p>
            </div>
            <div class="col-md-2">
              <input type="number" class="form-control quantity-input" value="1" min="1">
            </div>
            <div class="col-md-2 text-end">
              <p class="fw-bold">$79</p>
              <button class="btn btn-sm btn-outline-danger">Remove</button>
            </div>
          </div>
        </div>

        <!-- Add more cart items here -->
      </div>

      <!-- Order Summary -->
      <div class="col-lg-4">
        <div class="order-summary">
          <h5 class="mb-3">Delivery Details</h5>
          <input type="text" class="form-control mb-2" placeholder="Full Name">
          <input type="text" class="form-control mb-2" placeholder="Phone Number">
          <input type="text" class="form-control mb-2" placeholder="Delivery Address">
          <input type="text" class="form-control mb-2" placeholder="City">
          <input type="text" class="form-control mb-2" placeholder="Pincode">

          <h5 class="mt-4 mb-2">Payment Method</h5>
          <select class="form-select mb-3">
            <option>UPI</option>
            <option>Cash on Delivery</option>
            <option>Credit/Debit Card</option>
          </select>

          <h5 class="mt-3">Order Summary</h5>
          <ul class="list-group mb-3">
            <li class="list-group-item d-flex justify-content-between">Subtotal <span>$79</span></li>
            <li class="list-group-item d-flex justify-content-between">Shipping <span>$2</span></li>
            <li class="list-group-item d-flex justify-content-between fw-bold">Total <span>$81</span></li>
          </ul>
          <button class="btn btn-primary w-100">Place Order</button>
          <p class="text-muted mt-2 text-center">Tracking ID will be generated after order confirmation.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
