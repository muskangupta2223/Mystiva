<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | YourGiftStore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: #f8f9fa;
    }
    .navbar-brand {
      font-family: 'Great Vibes', cursive;
    }

    .navbar-gradient {
      background: linear-gradient(to right, #fdf5f8, #fff1f5);
    }
    .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    .signup-container {
      box-shadow: 0px 0px 25px rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      max-width: 1000px;
      width: 100%;
    }
    .img-cont{
        display: flex !important;
            align-items: center;
            justify-content: center;
    }
    .signup-image {
      background: url('https://i.pinimg.com/736x/d9/d5/37/d9d537e83678ffbe6753858928925048.jpg') no-repeat center center/cover;
      min-height: 550px;
    }
    .signup-form {
      padding: 40px;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-primary {
    border-radius: 10px;
    background-color: #c93c6b;
    border: none;
    color: #fff;
    transition: background-color 0.3s ease;
}

.btn-primary:hover {
    background-color: #a12047;
}
    .signin-link {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-gradient sticky-top shadow-lg py-1">
      <div class="container">
        <a class="navbar-brand fs-1 text-danger" href="home.html">Mystiva</a>
        <button class="navbar-toggler text-danger" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav gap-3">
            <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="product.html">Products</a></li>
            <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="product.html">Create Hamper</a></li>
            <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link text-danger fw-semibold" href="signup.html">Signup</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="#cart"><i class="fas fa-shopping-cart"></i></a></li>
          </ul>
        </div>
      </div>
    </nav>

<div class="container main-container">
  <div class="row signup-container">
    <!-- Left Side Image -->
    <div class="col-md-6 d-none d-md-block signup-image img-cont"><img src="https://i.pinimg.com/736x/d9/d5/37/d9d537e83678ffbe6753858928925048.jpg" width="100%" alt=""></div>

    <!-- Right Side Form -->
    <div class="col-md-6 d-flex align-items-center">
      <div class="signup-form w-100">
        <h2 class="mb-4 fw-bold text-center">Create Account 🎁</h2>
        <p class="text-muted text-center mb-5">Join our family of love spreaders 💖</p>

        <form>
          <div class="mb-3">
            <label for="fullname" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" id="fullname" placeholder="Enter your full name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Create password" required>
          </div>
          <div class="mb-3">
            <label for="confirmpassword" class="form-label fw-semibold">Confirm Password</label>
            <input type="password" class="form-control" id="confirmpassword" placeholder="Confirm your password" required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary py-2">Sign Up</button>
          </div>

          <p class="text-center text-muted mt-4 signin-link">
            Already have an account? <a href="login.html" class="text-primary text-decoration-none">Login here</a>
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
